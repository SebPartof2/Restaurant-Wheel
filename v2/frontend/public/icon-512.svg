<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a8a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#skyGrad)"/>

  <!-- Ferris Wheel Structure -->
  <g transform="translate(256, 220)">
    <!-- Main wheel circle -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#wheelGrad)" stroke-width="16"/>

    <!-- Spokes -->
    <g stroke="url(#wheelGrad)" stroke-width="8">
      <line x1="0" y1="-150" x2="0" y2="150"/>
      <line x1="-150" y1="0" x2="150" y2="0"/>
      <line x1="-106" y1="-106" x2="106" y2="106"/>
      <line x1="106" y1="-106" x2="-106" y2="106"/>
    </g>

    <!-- Center hub -->
    <circle cx="0" cy="0" r="28" fill="url(#wheelGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#FFD700"/>

    <!-- Gondolas/Cabins -->
    <g>
      <!-- Top -->
      <rect x="-22" y="-190" width="44" height="32" rx="8" fill="#FF6B6B"/>
      <!-- Right -->
      <rect x="136" y="-16" width="44" height="32" rx="8" fill="#4ECDC4"/>
      <!-- Bottom-right -->
      <rect x="88" y="114" width="44" height="32" rx="8" fill="#FFE66D"/>
      <!-- Bottom-left -->
      <rect x="-132" y="114" width="44" height="32" rx="8" fill="#95E1D3"/>
      <!-- Left -->
      <rect x="-180" y="-16" width="44" height="32" rx="8" fill="#F38181"/>
      <!-- Top-right -->
      <rect x="88" y="-146" width="44" height="32" rx="8" fill="#AA96DA"/>
      <!-- Top-left -->
      <rect x="-132" y="-146" width="44" height="32" rx="8" fill="#FCBAD3"/>
      <!-- Bottom -->
      <rect x="-22" y="158" width="44" height="32" rx="8" fill="#A8D8EA"/>
    </g>
  </g>

  <!-- Support stand -->
  <polygon points="256,370 186,465 326,465" fill="url(#wheelGrad)"/>
  <rect x="226" y="465" width="60" height="20" rx="6" fill="url(#wheelGrad)"/>
</svg>
